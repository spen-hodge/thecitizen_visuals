const loadPdfJs = () => new Promise((res, rej) => {
  if (window.pdfjsLib) return res(window.pdfjsLib);
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
  s.onerror = () => rej(new Error("PDF.js failed")); document.head.appendChild(s);
});
const extractPdf = async (file) => {
  const lib = await loadPdfJs(); const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const pages = Math.min(pdf.numPages, 30); let text = "";
  for (let i = 1; i <= pages; i++) { const pg = await pdf.getPage(i); const c = await pg.getTextContent(); text += c.items.map(x => x.str).join(" ") + "\n\n"; }
  return { text: text.slice(0, 60000), totalPages: pdf.numPages, extractedPages: pages };
};

const callAI = async (dt, text) => {
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: buildPrompt(dt, text) }] }) });

};

/* ═══ CALCS ═══ */
const calcAbatement = d => { const p = pN(d.abatementPct), y = pN(d.abatementYears), r = pN(d.cityTaxRate), v = pN(d.estimatedValue); return (p > 0 && y > 0 && v > 0) ? (p / 100) * ((r > 0 ? r / 100 : 0.025) * v) * y : 0; };
const calcTotal = d => calcAbatement(d) + pN(d.feeWaivers) + pN(d.infraContribCity) + pN(d.landContrib) + pN(d.grantAmount) + pN(d.otherIncentives);
const getEff = d => { const o = pN(d.totalIncentiveOverride); return o > 0 ? o : calcTotal(d); };

const calcMarketScore = (d) => {
  let score = 0, max = 10;
  const vac = pN(d.submarketVacancy);
  if (vac > 15) score += 3; else if (vac > 8) score += 2; else if (vac > 0) score += 0.5;
  const mo = pN(d.monthsOfInventory);
  if (mo > 18) score += 2; else if (mo > 10) score += 1;
  const prem = pN(d.siteCostPremium);
  if (prem > 500000) score += 2; else if (prem > 100000) score += 1;
  if (d.hasFeasibilityStudy === "yes") score += 1.5; else if (d.hasFeasibilityStudy === "no") score -= 0.5;
  if (d.hasFinancialDisclosure === "yes") score += 1.5;
  return { score: Math.max(0, Math.round(score * 10) / 10), max };
};

const calcInfraRisk = (d) => {
  let score = 0, max = 10;
  const wCap = pN(d.waterCapacityGPD), wCur = pN(d.waterCurrentGPD), wDem = pN(d.waterDemandGPD);
  if (wCap > 0) { const postUtil = (wCur + wDem) / wCap; if (postUtil < 0.75) score += 2.5; else if (postUtil < 0.85) score += 1.5; else if (postUtil < 0.95) score += 0.5; }
  const sCap = pN(d.sewerCapacityGPD), sCur = pN(d.sewerCurrentGPD), sDem = pN(d.sewerDemandGPD);
  if (sCap > 0) { const postUtil = (sCur + sDem) / sCap; if (postUtil < 0.75) score += 2.5; else if (postUtil < 0.85) score += 1.5; else if (postUtil < 0.95) score += 0.5; }
  const pAvail = pN(d.powerAvailableMW), pDem = pN(d.powerDemandMW);
  if (pAvail > 0 && pDem > 0 && pDem / pAvail < 0.5) score += 2; else if (pAvail > 0 && pDem > 0 && pDem / pAvail < 0.75) score += 1;
  const devContrib = pN(d.developerInfraContrib), totalInfra = pN(d.infraCostEst);
  if (totalInfra > 0 && devContrib / totalInfra >= 0.8) score += 3; else if (totalInfra > 0 && devContrib / totalInfra >= 0.5) score += 2; else if (totalInfra > 0 && devContrib / totalInfra >= 0.25) score += 1;
  return { score: Math.round(Math.min(score, max) * 10) / 10, max };
};

const computeScores = (d) => {
  const r = n => Math.round(n * 10) / 10;
  let inc = 0; if (d.incentiveTypes.length > 0) inc++; if (getEff(d) > 0) inc++; if (pN(d.abatementYears) > 0 && pN(d.abatementYears) <= 10) inc++;
  let fis = 0; const rv = pN(d.projectedRevAnnual), co = pN(d.projectedCostAnnual);
  if (rv > 0 && co > 0) { if (rv > co * 1.25) fis += 2; else if (rv > co) fis += 1.5; else if (rv > co * 0.75) fis += 0.5; }
  const pb = pN(d.paybackYears); if (pb > 0 && pb <= 5) fis += 2; else if (pb > 0 && pb <= 10) fis += 1; else if (pb > 10) fis += 0.5;
  let per = 0;
  // Cost per Job: < $15k strong, $15-30k moderate, >$30k weak
  const fte = pN(d.jobsFTE), effInc = getEff(d);
  const cpj = fte > 0 && effInc > 0 ? effInc / fte : 0;
  if (cpj > 0 && cpj < 15000) per += 1.5; else if (cpj > 0 && cpj < 30000) per += 1; else if (cpj > 0) per += 0.5;
  // Wage Premium: >20% above median strong, 0-20% moderate, below median weak
  const wage = pN(d.wageAnnual), median = pN(d.areaMedianWage);
  const wagePrem = median > 0 && wage > 0 ? (wage - median) / median : -1;
  if (wagePrem >= 0.2) per += 1; else if (wagePrem >= 0) per += 0.5;
  // Capital per Job: higher = better commitment
  const capMin = pN(d.capitalInvestMin);
  const capPerJob = fte > 0 && capMin > 0 ? capMin / fte : 0;
  if (capPerJob >= 200000) per += 1; else if (capPerJob >= 100000) per += 0.5;
  // Clawback: % of incentive recoverable
  const clawPct = pN(d.clawbackPct);
  if (d.hasClawback === "yes" && clawPct >= 80) per += 2; else if (d.hasClawback === "yes" && clawPct >= 50) per += 1.5;
  else if (d.hasClawback === "partial" && clawPct > 0) per += 1; else if (d.hasClawback === "yes") per += 1;
  // Reporting
  if (d.reportingFrequency === "quarterly") per += 1.5; else if (d.reportingFrequency === "annual") per += 1;
  // Milestone density: milestones per year of agreement
  const mCount = pN(d.milestoneCount), cDeadline = pN(d.completionDeadlineYrs);
  const mDensity = cDeadline > 0 && mCount > 0 ? mCount / cDeadline : 0;
  if (mDensity >= 2) per += 1; else if (mDensity >= 1) per += 0.5;
  const mkt = calcMarketScore(d), inf = calcInfraRisk(d);
  const total = r(inc + fis + per) + r(mkt.score / mkt.max * 5) + r(inf.score / inf.max * 5);
  return { incentive: { score: r(inc), max: 3 }, fiscal: { score: r(fis), max: 5 }, performance: { score: r(Math.min(per, 8)), max: 8 }, market: mkt, infrastructure: inf, total: { score: r(inc + fis + Math.min(per, 8)) + r(mkt.score / mkt.max * 5) + r(inf.score / inf.max * 5), max: 26 } };
};

      <Field label="Developer" aiDraft={ai.has("developer")}><input style={iBase} value={d.developer} onChange={e => s("developer", e.target.value)} placeholder="e.g., XYZ Development LLC" /></Field>
      <Field label="Project Type" aiDraft={ai.has("projectType")}><select style={{ ...iBase, appearance: "auto" }} value={d.projectType} onChange={e => s("projectType", e.target.value)}><option value="">Select...</option>{["Residential","Commercial","Industrial","Mixed Use","Data Center","Retail","Office","Warehouse","Other"].map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
      <Field label="Project Acreage" sublabel="Required for per-acre analysis" aiDraft={ai.has("acreage")} lookups={[LOOKUPS.parcelSearch]}><NIn value={d.acreage} onChange={v => s("acreage", v)} placeholder="e.g., 45" suffix="ac" /></Field>
      <Field label="Location" aiDraft={ai.has("location")}><input style={iBase} value={d.location} onChange={e => s("location", e.target.value)} placeholder="Address or area" /></Field>
      <Field label="Estimated Project Value" aiDraft={ai.has("estimatedValue")} lookups={[LOOKUPS.parcelSearch]}><DIn value={d.estimatedValue} onChange={v => s("estimatedValue", v)} placeholder="50000000" /></Field>
      <Field label="City Tax Rate" sublabel="Per $100 valuation" aiDraft={ai.has("cityTaxRate")} lookups={[LOOKUPS.taxRate]}><NIn value={d.cityTaxRate} onChange={v => s("cityTaxRate", v)} placeholder="e.g., 0.52" suffix="/$100" /></Field>
      <Field label="Deal Date" sublabel="Date agreement was approved or signed"><input style={iBase} type="date" value={d.dealDate} onChange={e => s("dealDate", e.target.value)} /></Field>
      <Field label="Population" sublabel="Current city/jurisdiction population" aiDraft={ai.has("jurisdictionPop")} lookups={[LOOKUPS.population]}><NIn value={d.jurisdictionPop} onChange={v => s("jurisdictionPop", v)} placeholder="7200" /></Field>
      <Field label="Total Assessed Valuation" sublabel="Jurisdiction-wide" aiDraft={ai.has("existingTaxBase")} lookups={[LOOKUPS.taxBase, LOOKUPS.taxRate]}><DIn value={d.existingTaxBase} onChange={v => s("existingTaxBase", v)} placeholder="800000000" /></Field>
      <Field label="Jurisdiction Total Acreage" sublabel="For avg productivity comparison" lookups={[LOOKUPS.nctcog]}><NIn value={d.jurisdictionAcreage} onChange={v => s("jurisdictionAcreage", v)} placeholder="e.g., 3200" suffix="ac" /></Field>
    </div>
    {pv > 0 && tb > 0 && <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
      <CB label="% of Tax Base" value={((pv / tb) * 100).toFixed(1) + "%"} color={pv / tb > 0.1 ? B.yellow : B.green} sub={pv / tb > 0.1 ? ">10% concentration" : "< 10%"} />
      {ac > 0 && <CB label="Value per Acre" value={fD(pv / ac)} color={B.indigo} />}
      {pop > 0 && <CB label="Per Capita" value={fD(pv / pop)} color={B.indigo} />}
    </div>}
  </div>;
}

function IncentiveSec({ d, s, scores, ai }) {
  const auto = calcTotal(d), eff = getEff(d), pv = pN(d.estimatedValue), abt = calcAbatement(d), ratio = pv > 0 && eff > 0 ? eff / pv : 0, ac = pN(d.acreage);
  return <div>
    <SH icon="💰" title="Incentive Structure" score={scores.incentive.score} max={scores.incentive.max} />
    <GN>GFOA: define permissible tools, maximum amounts, time limits, eligible types. Verify funding does not exceed what is necessary.</GN>
    <Field label="Incentive Types" wide aiDraft={ai.has("incentiveTypes")} lookups={[LOOKUPS.comptrollerAbatement, LOOKUPS.comptrollerCh380]}>
      <Checks values={d.incentiveTypes} onChange={v => s("incentiveTypes", v)} options={[{value:"tax_abatement",label:"Ch. 312 Abatement"},{value:"ch380",label:"Ch. 380"},{value:"fee_waiver",label:"Fee Waivers"},{value:"infrastructure",label:"Infrastructure"},{value:"land",label:"Land"},{value:"tif",label:"TIF/TIRZ"},{value:"grants",label:"Grants"},{value:"other",label:"Other"}]} />
    </Field>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Abatement %" sublabel="% of property tax abated per agreement" aiDraft={ai.has("abatementPct")} lookups={[LOOKUPS.comptrollerAbatement]}><NIn value={d.abatementPct} onChange={v => s("abatementPct", v)} placeholder="75" suffix="%" /></Field>
      <Field label="Duration" sublabel="Length of abatement period" aiDraft={ai.has("abatementYears")}><NIn value={d.abatementYears} onChange={v => s("abatementYears", v)} placeholder="10" suffix="yrs" /></Field>
      <Field label="Fee Waivers" sublabel="Permit, impact, and connection fees waived" aiDraft={ai.has("feeWaivers")} lookups={[LOOKUPS.feeSchedule]}><DIn value={d.feeWaivers} onChange={v => s("feeWaivers", v)} placeholder="250000" /></Field>
      <Field label="City Infra $" sublabel="City's infrastructure contribution to the project" aiDraft={ai.has("infraContribCity")}><DIn value={d.infraContribCity} onChange={v => s("infraContribCity", v)} placeholder="1500000" /></Field>
      <Field label="Land $" sublabel="Market value of public land transferred to developer" aiDraft={ai.has("landContrib")}><DIn value={d.landContrib} onChange={v => s("landContrib", v)} placeholder="500000" /></Field>
      <Field label="Grants" sublabel="Direct cash subsidies or grants from public funds" aiDraft={ai.has("grantAmount")}><DIn value={d.grantAmount} onChange={v => s("grantAmount", v)} placeholder="200000" /></Field>
      <Field label="Other $" sublabel="Any other public incentives not listed above"><DIn value={d.otherIncentives} onChange={v => s("otherIncentives", v)} placeholder="100000" /></Field>
      <Field label="Total Override" sublabel="Override auto-calc"><DIn value={d.totalIncentiveOverride} onChange={v => s("totalIncentiveOverride", v)} placeholder="Leave blank for auto" /></Field>
    </div>
    <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
      <CB label="Total (calc)" value={fD(auto)} color={B.indigo} sub={abt > 0 ? `Abatement: ${fD(abt)}` : "Enter rate + % + yrs"} />
      {ratio > 0 && <CB label="Incentive Ratio" value={(ratio * 100).toFixed(1) + "%"} color={ratio > 0.25 ? B.red : ratio > 0.1 ? B.yellow : B.green} />}
      {ac > 0 && eff > 0 && <CB label="Incentive/Acre" value={fD(eff / ac)} color={B.poppy} />}
    </div>
  </div>;
}

function MarketSec({ d, s, scores, ai }) {
  const mk = scores.market;
  return <div>
    <SH icon="📈" title="Market Evidence" subtitle="Empirical data replacing 'but-for' opinion. All fields are publicly verifiable." score={mk.score} max={mk.max} />
    <GN>GFOA: incentives exist to induce activity that would not otherwise occur. Feasibility studies should determine whether development could proceed without assistance. All data below should be documented and verifiable.</GN>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Submarket Vacancy Rate" sublabel="For this use type at this location"><NIn value={d.submarketVacancy} onChange={v => s("submarketVacancy", v)} placeholder="e.g., 12.5" suffix="%" /></Field>
      <Field label="Comparable Sale Price" sublabel="Recent comparable $/SF for this use" lookups={[LOOKUPS.parcelSearch]}><NIn value={d.comparableSalePSF} onChange={v => s("comparableSalePSF", v)} placeholder="e.g., 185" suffix="$/SF" /></Field>
      <Field label="Months of Inventory" sublabel="Absorption rate for this use type"><NIn value={d.monthsOfInventory} onChange={v => s("monthsOfInventory", v)} placeholder="e.g., 14" suffix="mo" /></Field>
      <Field label="Documented Site Cost Premium" sublabel="Remediation, geotech, flood — $ above comparable" lookups={[LOOKUPS.parcelSearch]}><DIn value={d.siteCostPremium} onChange={v => s("siteCostPremium", v)} placeholder="e.g., 750000" /></Field>
      <Field label="Competing Jurisdictions" sublabel="Number of jurisdictions with documented competing bids" lookups={[LOOKUPS.nctcog]}><NIn value={d.competingJurisdictions} onChange={v => s("competingJurisdictions", v)} placeholder="e.g., 3" /></Field>
      <Field label="Independent Feasibility Study" sublabel="Has developer provided one?" wide>
        <Radio name="feasibility" value={d.hasFeasibilityStudy} onChange={v => s("hasFeasibilityStudy", v)} options={[{value:"yes",label:"Yes — on file"},{value:"no",label:"No"},{value:"requested",label:"Requested, not received"}]} />
      </Field>
      <Field label="Financial Disclosure" sublabel="Developer financial capacity documented?" wide>
        <Radio name="disclosure" value={d.hasFinancialDisclosure} onChange={v => s("hasFinancialDisclosure", v)} options={[{value:"yes",label:"Yes — on file"},{value:"no",label:"No"},{value:"partial",label:"Partial"}]} />
      </Field>
    </div>
    {/* Calculated but-for conclusion */}
    <div style={{ padding: "16px", background: B.sand, borderRadius: 6, marginTop: 12, fontSize: 13, lineHeight: 1.6 }}>
      <strong style={{ color: B.indigo }}>Calculated Market Evidence Assessment:</strong>
      {pN(d.submarketVacancy) > 15 ? <div>• High vacancy ({d.submarketVacancy}%) — weak market supports incentive justification</div> : pN(d.submarketVacancy) > 0 ? <div>• Vacancy at {d.submarketVacancy}% — {pN(d.submarketVacancy) < 5 ? "very tight market questions incentive necessity" : "moderate vacancy"}</div> : null}
      {pN(d.monthsOfInventory) > 18 ? <div>• {d.monthsOfInventory} months inventory — slow absorption supports incentive case</div> : pN(d.monthsOfInventory) > 0 ? <div>• {d.monthsOfInventory} months inventory — {pN(d.monthsOfInventory) < 6 ? "strong absorption weakens incentive case" : "moderate absorption"}</div> : null}
      {pN(d.siteCostPremium) > 0 && <div>• {fD(pN(d.siteCostPremium))} documented site premium supports cost gap argument</div>}
      {d.hasFeasibilityStudy === "no" && <div style={{ color: B.red }}>• No feasibility study provided — GFOA requires independent verification</div>}
      {d.hasFinancialDisclosure === "no" && <div style={{ color: B.red }}>• No financial disclosure — developer capacity unverified</div>}
    </div>
  </div>;
}

function InfraCapSec({ d, s, scores, ai }) {
  const inf = scores.infrastructure;
  const wCap = pN(d.waterCapacityGPD), wCur = pN(d.waterCurrentGPD), wDem = pN(d.waterDemandGPD);
  const sCap = pN(d.sewerCapacityGPD), sCur = pN(d.sewerCurrentGPD), sDem = pN(d.sewerDemandGPD);
  const pAvail = pN(d.powerAvailableMW), pDem = pN(d.powerDemandMW);
  const ac = pN(d.acreage), totalInfra = pN(d.infraCostEst), devContrib = pN(d.developerInfraContrib);
  const deferred = pN(d.deferredMaintenanceBacklog);
  const lifecycle30 = totalInfra * 3.5;
  const unfunded = lifecycle30 - devContrib;

  return <div>
    <SH icon="🏗️" title="Infrastructure Capacity & Risk Exposure" subtitle="Empirical capacity data — all from public utility reports and city documents." score={inf.score} max={inf.max} />
    <GN>GFOA: estimate full lifecycle costs, impact on existing assets, and additional burden from new development. Deferred maintenance costs 4–5× more in emergency repairs.</GN>
    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Water System</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Plant Capacity" sublabel="Rated treatment capacity in gallons per day" lookups={[LOOKUPS.tceqWater, LOOKUPS.tceqCCR]}><NIn value={d.waterCapacityGPD} onChange={v => s("waterCapacityGPD", v)} placeholder="e.g., 2000000" suffix="GPD" /></Field>
      <Field label="Current Demand" sublabel="Average daily water usage system-wide" lookups={[LOOKUPS.tceqCCR, LOOKUPS.cityBudget]}><NIn value={d.waterCurrentGPD} onChange={v => s("waterCurrentGPD", v)} placeholder="e.g., 1400000" suffix="GPD" /></Field>
      <Field label="Project Demand" sublabel="Estimated daily water use from this project" aiDraft={ai.has("waterDemandGPD")}><NIn value={d.waterDemandGPD} onChange={v => s("waterDemandGPD", v)} placeholder="e.g., 300000" suffix="GPD" /></Field>
    </div>
    {wCap > 0 && <div style={{ display: "flex", gap: 16, marginTop: 4, marginBottom: 12, flexWrap: "wrap" }}>
      <CB label="Current Util." value={((wCur / wCap) * 100).toFixed(0) + "%"} color={wCur / wCap > 0.85 ? B.red : wCur / wCap > 0.75 ? B.yellow : B.green} />
      <CB label="Post-Project" value={(((wCur + wDem) / wCap) * 100).toFixed(0) + "%"} color={(wCur + wDem) / wCap > 0.85 ? B.red : (wCur + wDem) / wCap > 0.75 ? B.yellow : B.green} sub={(wCur + wDem) > wCap ? "EXCEEDS CAPACITY" : ""} />
      <CB label="Remaining" value={((wCap - wCur - wDem) / 1000).toFixed(0) + "k GPD"} color={(wCap - wCur - wDem) < 0 ? B.red : B.green} />
    </div>}

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Sewer System</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Plant Capacity" sublabel="Rated wastewater treatment capacity" lookups={[LOOKUPS.tceqWater]}><NIn value={d.sewerCapacityGPD} onChange={v => s("sewerCapacityGPD", v)} placeholder="e.g., 1500000" suffix="GPD" /></Field>
      <Field label="Current Flow" sublabel="Average daily wastewater flow" lookups={[LOOKUPS.cityBudget]}><NIn value={d.sewerCurrentGPD} onChange={v => s("sewerCurrentGPD", v)} placeholder="e.g., 1000000" suffix="GPD" /></Field>
      <Field label="Project Demand" sublabel="Estimated daily wastewater from this project" aiDraft={ai.has("sewerDemandGPD")}><NIn value={d.sewerDemandGPD} onChange={v => s("sewerDemandGPD", v)} placeholder="e.g., 200000" suffix="GPD" /></Field>
    </div>
    {sCap > 0 && <div style={{ display: "flex", gap: 16, marginTop: 4, marginBottom: 12, flexWrap: "wrap" }}>
      <CB label="Current Util." value={((sCur / sCap) * 100).toFixed(0) + "%"} color={sCur / sCap > 0.85 ? B.red : sCur / sCap > 0.75 ? B.yellow : B.green} />
      <CB label="Post-Project" value={(((sCur + sDem) / sCap) * 100).toFixed(0) + "%"} color={(sCur + sDem) / sCap > 0.85 ? B.red : (sCur + sDem) / sCap > 0.75 ? B.yellow : B.green} />
    </div>}

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Power & Roads</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Available Power Capacity" sublabel="Substation/grid capacity at this location" lookups={[{ label: "Oncor / ERCOT", url: "https://www.oncor.com/" }]}><NIn value={d.powerAvailableMW} onChange={v => s("powerAvailableMW", v)} placeholder="e.g., 50" suffix="MW" /></Field>
      <Field label="Project Power Demand" sublabel="Project's expected electrical load" aiDraft={ai.has("powerDemandMW")}><NIn value={d.powerDemandMW} onChange={v => s("powerDemandMW", v)} placeholder="e.g., 20" suffix="MW" /></Field>
      <Field label="Road Lane-Miles Required" sublabel="New or widened lane-miles for project access" aiDraft={ai.has("roadLaneMiles")} lookups={[LOOKUPS.txdotCosts]}><NIn value={d.roadLaneMiles} onChange={v => s("roadLaneMiles", v)} placeholder="e.g., 2.5" suffix="mi" /></Field>
      <Field label="Cost per Lane-Mile" sublabel="Construction cost per lane-mile in this area" lookups={[LOOKUPS.txdotCosts]}><DIn value={d.roadCostPerMile} onChange={v => s("roadCostPerMile", v)} placeholder="e.g., 3500000" /></Field>
    </div>

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Cost & Funding</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Total Infrastructure Cost Est." sublabel="Combined roads, water, sewer, drainage" lookups={[LOOKUPS.cityBudget]}><DIn value={d.infraCostEst} onChange={v => s("infraCostEst", v)} placeholder="3000000" /></Field>
      <Field label="Deferred Maintenance Backlog" sublabel="Existing city infrastructure backlog" lookups={[LOOKUPS.cityBudget]}><DIn value={d.deferredMaintenanceBacklog} onChange={v => s("deferredMaintenanceBacklog", v)} placeholder="e.g., 5000000" /></Field>
      <Field label="Developer Infrastructure Contribution" sublabel="Developer's committed $ toward infrastructure"><DIn value={d.developerInfraContrib} onChange={v => s("developerInfraContrib", v)} placeholder="e.g., 2000000" /></Field>
      <Field label="Funding Source" sublabel="Who is primarily responsible for infrastructure costs" wide>
        <Radio name="infraF" value={d.infraFundingSource} onChange={v => s("infraFundingSource", v)} options={[{value:"developer",label:"Developer"},{value:"shared",label:"Shared"},{value:"city",label:"City"},{value:"mud",label:"MUD"}]} />
      </Field>
    </div>
    {totalInfra > 0 && <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
      <CB label="30-Yr Lifecycle" value={fD(lifecycle30)} color={B.yellow} sub="3.5× initial (GFOA)" />
      <CB label="Unfunded Gap" value={fD(Math.max(0, unfunded))} color={unfunded > 0 ? B.red : B.green} sub={unfunded > 0 ? "Lifecycle cost minus developer $" : "Fully funded"} />
      {ac > 0 && <CB label="Infra Cost/Acre" value={fD(totalInfra / ac)} color={B.indigo} />}
      {ac > 0 && <CB label="Lifecycle/Acre (30yr)" value={fD(lifecycle30 / ac)} color={B.yellow} />}
      {deferred > 0 && <CB label="Backlog + New" value={fD(deferred + totalInfra)} color={B.red} sub="Total infra burden" />}
    </div>}
  </div>;
}

function PerfSec({ d, s, scores, ai }) {
  const fte = pN(d.jobsFTE), eff = getEff(d), ac = pN(d.acreage);
  const cpj = fte > 0 && eff > 0 ? eff / fte : 0;
  const wage = pN(d.wageAnnual), median = pN(d.areaMedianWage);
  const wagePrem = median > 0 && wage > 0 ? ((wage - median) / median) * 100 : 0;
  const totalPayroll = fte > 0 && wage > 0 ? fte * wage : 0;
  const capMin = pN(d.capitalInvestMin);
  const capPerJob = fte > 0 && capMin > 0 ? capMin / fte : 0;
  const clawPct = pN(d.clawbackPct);
  const maxRecoverable = eff > 0 && clawPct > 0 ? eff * (clawPct / 100) : 0;
  const mCount = pN(d.milestoneCount), cDeadline = pN(d.completionDeadlineYrs);
  const mDensity = cDeadline > 0 && mCount > 0 ? mCount / cDeadline : 0;

  return <div>
    <SH icon="📐" title="Performance & Accountability" subtitle="Every field feeds a formula. No opinion inputs." score={scores.performance.score} max={scores.performance.max} />
    <GN>GFOA: performance standards must be specific and quantitative — with enforceable clawback, frequent reporting, and measurable benchmarks. This section scores against calculated thresholds, not presence checks.</GN>

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Employment Commitment</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="FTEs Committed" sublabel="Full-time equivalent jobs required by agreement" aiDraft={ai.has("jobsFTE")}><NIn value={d.jobsFTE} onChange={v => s("jobsFTE", v)} placeholder="e.g., 150" suffix="FTE" /></Field>
      <Field label="Job Creation Deadline" sublabel="Years to reach full employment target"><NIn value={d.jobsDeadlineYrs} onChange={v => s("jobsDeadlineYrs", v)} placeholder="e.g., 3" suffix="yrs" /></Field>
      <Field label="Required Annual Wage" sublabel="Minimum per-employee compensation in agreement" aiDraft={ai.has("wageAnnual")} lookups={[LOOKUPS.bls]}><DIn value={d.wageAnnual} onChange={v => s("wageAnnual", v)} placeholder="e.g., 65000" /></Field>
      <Field label="Area Median Wage" sublabel="BLS area median for comparison" lookups={[LOOKUPS.bls]}><DIn value={d.areaMedianWage} onChange={v => s("areaMedianWage", v)} placeholder="e.g., 52000" /></Field>
    </div>
    {(cpj > 0 || wagePrem !== 0 || totalPayroll > 0) && <div style={{ display: "flex", gap: 16, marginTop: 8, marginBottom: 16, flexWrap: "wrap" }}>
      {cpj > 0 && <CB label="Cost per Job" value={fD(cpj)} color={cpj < 15000 ? B.green : cpj < 30000 ? B.yellow : B.red} sub={cpj < 15000 ? "Strong — under $15k/job" : cpj < 30000 ? "Moderate — $15-30k/job" : "High — over $30k/job"} />}
      {wagePrem !== 0 && median > 0 && <CB label="Wage Premium" value={wagePrem.toFixed(0) + "% vs median"} color={wagePrem >= 20 ? B.green : wagePrem >= 0 ? B.yellow : B.red} sub={wagePrem >= 20 ? "20%+ above area median" : wagePrem >= 0 ? "At or above median" : "Below area median"} />}
      {totalPayroll > 0 && <CB label="Annual Payroll Impact" value={fD(totalPayroll)} color={B.indigo} sub={fte + " FTEs × " + fD(wage)} />}
      {fte > 0 && ac > 0 && <CB label="Jobs per Acre" value={(fte / ac).toFixed(1)} color={B.indigo} />}
    </div>}

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Capital Investment</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Min Capital Investment" sublabel="Minimum $ developer must invest per agreement" aiDraft={ai.has("capitalInvestMin")}><DIn value={d.capitalInvestMin} onChange={v => s("capitalInvestMin", v)} placeholder="e.g., 25000000" /></Field>
    </div>
    {capMin > 0 && <div style={{ display: "flex", gap: 16, marginTop: 8, marginBottom: 16, flexWrap: "wrap" }}>
      {eff > 0 && <CB label="Incentive-to-Capital" value={((eff / capMin) * 100).toFixed(1) + "%"} color={eff / capMin < 0.1 ? B.green : eff / capMin < 0.25 ? B.yellow : B.red} sub="Total incentive as % of capital" />}
      {capPerJob > 0 && <CB label="Capital per Job" value={fD(capPerJob)} color={capPerJob >= 200000 ? B.green : capPerJob >= 100000 ? B.yellow : B.red} sub={capPerJob >= 200000 ? "Strong commitment per FTE" : "Moderate"} />}
      {ac > 0 && <CB label="Capital per Acre" value={fD(capMin / ac)} color={B.indigo} />}
    </div>}

    <h3 style={{ fontSize: 14, fontWeight: 700, color: B.indigo, margin: "16px 0 10px" }}>Enforcement & Monitoring</h3>
    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px" }}>
      <Field label="Clawback Provision" sublabel="Can the city recover incentives if terms aren't met?" wide aiDraft={ai.has("hasClawback")}><Radio name="claw" value={d.hasClawback} onChange={v => s("hasClawback", v)} options={[{value:"yes",label:"Full recapture"},{value:"partial",label:"Partial"},{value:"no",label:"None"}]} /></Field>
      <Field label="Clawback Recovery %" sublabel="Maximum % of incentive that can be recaptured"><NIn value={d.clawbackPct} onChange={v => s("clawbackPct", v)} placeholder="e.g., 100" suffix="%" /></Field>
      <Field label="Reporting Frequency" sublabel="How often developer must report compliance to city" wide><Radio name="rep" value={d.reportingFrequency} onChange={v => s("reportingFrequency", v)} options={[{value:"quarterly",label:"Quarterly"},{value:"annual",label:"Annual"},{value:"none",label:"None required"}]} /></Field>
      <Field label="Performance Milestones" sublabel="Number of defined checkpoints in the agreement"><NIn value={d.milestoneCount} onChange={v => s("milestoneCount", v)} placeholder="e.g., 5" /></Field>
      <Field label="Completion Deadline" sublabel="Years to full project completion"><NIn value={d.completionDeadlineYrs} onChange={v => s("completionDeadlineYrs", v)} placeholder="e.g., 5" suffix="yrs" /></Field>
      <Field label="Notes" sublabel="Notable gaps, vague language, or enforcement concerns" wide><textarea style={{ ...iBase, minHeight: 50, resize: "vertical" }} value={d.performanceNotes} onChange={e => s("performanceNotes", e.target.value)} placeholder="Vague language, enforcement gaps..." /></Field>
    </div>
    {(maxRecoverable > 0 || mDensity > 0) && <div style={{ display: "flex", gap: 16, marginTop: 8, flexWrap: "wrap" }}>
      {maxRecoverable > 0 && <CB label="Max Recoverable" value={fD(maxRecoverable)} color={clawPct >= 80 ? B.green : clawPct >= 50 ? B.yellow : B.red} sub={clawPct + "% of " + fD(eff) + " total incentive"} />}
      {mDensity > 0 && <CB label="Milestone Density" value={mDensity.toFixed(1) + "/yr"} color={mDensity >= 2 ? B.green : mDensity >= 1 ? B.yellow : B.red} sub={mCount + " milestones over " + cDeadline + " years"} />}
    </div>}
  </div>;
}

function ProductivitySec({ d, scores }) {
  const ac = pN(d.acreage), pv = pN(d.estimatedValue), rv = pN(d.projectedRevAnnual), co = pN(d.projectedCostAnnual);
  const eff = getEff(d), net = rv - co, totalInfra = pN(d.infraCostEst);
  const jAc = pN(d.jurisdictionAcreage), tb = pN(d.existingTaxBase);
  const jAvgVPA = jAc > 0 && tb > 0 ? tb / jAc : 0;
  const projVPA = ac > 0 && pv > 0 ? pv / ac : 0;
  const autoPB = net > 0 && eff > 0 ? Math.ceil(eff / net) : 0;
  const uPB = pN(d.paybackYears); const dPB = uPB > 0 ? uPB : autoPB;

  if (ac === 0) return <div><SH icon="📊" title="Fiscal Productivity per Acre" /><div style={{ padding: 24, textAlign: "center", color: B.gray, fontSize: 14 }}>Enter project acreage in the Overview section to unlock per-acre analysis.</div></div>;

  return <div>
    <SH icon="📊" title="Fiscal Productivity per Acre" subtitle="Urban3/Strong Towns methodology — normalized to the city's average to enable apples-to-apples comparison." />
    <GN>Value per acre normalizes fiscal productivity across land uses. GFOA recommends cost-benefit analysis comparing incentive cost against projected benefits and evaluating impact on the existing tax base.</GN>

    <div style={{ display: "flex", flexWrap: "wrap", gap: "0 24px", marginBottom: 12 }}>
      <Field label="Annual Revenue at Stabilization" sublabel="Property tax + sales tax + fees" lookups={[LOOKUPS.cityBudget, LOOKUPS.taxRate]}><DIn value={d.projectedRevAnnual} onChange={() => {}} placeholder="Enter in Incentives section" /></Field>
      <Field label="Annual Service Cost" sublabel="Roads, water, police, fire, admin" lookups={[LOOKUPS.cityBudget]}><DIn value={d.projectedCostAnnual} onChange={() => {}} placeholder="Enter in Incentives section" /></Field>
    </div>

    <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>
      <CB label="Assessed Value/Acre" value={fD(projVPA)} color={B.indigo} sub={jAvgVPA > 0 ? `City avg: ${fD(jAvgVPA)}/ac` : ""} />
      {rv > 0 && <CB label="Revenue/Acre" value={fD(rv / ac)} color={B.green} />}
      {co > 0 && <CB label="Cost/Acre" value={fD(co / ac)} color={B.red} />}
      {rv > 0 && co > 0 && <CB label="Net Productivity/Acre" value={fD(net / ac)} color={net >= 0 ? B.green : B.red} sub={net >= 0 ? "Revenue exceeds cost" : "Cost exceeds revenue"} />}
    </div>

    {jAvgVPA > 0 && projVPA > 0 && <div style={{ padding: 16, background: projVPA / jAvgVPA >= 1 ? B.green + "0A" : B.red + "0A", border: `1px solid ${projVPA / jAvgVPA >= 1 ? B.green : B.red}20`, borderRadius: 6, marginBottom: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: projVPA / jAvgVPA >= 1 ? B.green : B.red }}>Productivity Ratio: {(projVPA / jAvgVPA).toFixed(2)}x city average</div>
      <div style={{ fontSize: 12, color: B.gray, marginTop: 4 }}>{projVPA / jAvgVPA >= 1 ? "This project's assessed value per acre meets or exceeds the jurisdiction average." : "This project is less fiscally productive per acre than the jurisdiction average."}</div>
    </div>}

    <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 16 }}>
      {eff > 0 && <CB label="Incentive/Acre" value={fD(eff / ac)} color={B.poppy} />}
      {totalInfra > 0 && <CB label="Infra Cost/Acre" value={fD(totalInfra / ac)} color={B.yellow} />}
      {totalInfra > 0 && <CB label="30-Yr Lifecycle/Acre" value={fD(totalInfra * 3.5 / ac)} color={B.yellow} sub="3.5× initial" />}
      {pN(d.jobsFTE) > 0 && <CB label="Jobs/Acre" value={(pN(d.jobsFTE) / ac).toFixed(1)} color={B.indigo} />}
    </div>

    {rv > 0 && co > 0 && eff > 0 && <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
      <CB label="Rev:Cost Ratio" value={(rv / co).toFixed(2) + "x"} color={rv / co >= 1.25 ? B.green : rv / co >= 1 ? B.yellow : B.red} />
      {dPB > 0 && <CB label="Payback" value={dPB + " yrs"} color={dPB <= 5 ? B.green : dPB <= 10 ? B.yellow : B.red} sub={uPB > 0 ? "User entered" : "Incentive ÷ net annual"} />}
      <CB label="10-Yr Net" value={fD(net * 10 - eff)} color={(net * 10 - eff) >= 0 ? B.green : B.red} />
    </div>}
  </div>;
}

function ReportSec({ d, scores, onReset, aiCount }) {
  const t = scores.total, p = t.max > 0 ? t.score / t.max : 0, grade = pctL(p), gc = pctC(p);
  const eff = getEff(d), rv = pN(d.projectedRevAnnual), co = pN(d.projectedCostAnnual), net = rv - co, ac = pN(d.acreage);
  const flags = [], strengths = [];
  if (d.hasClawback === "no") flags.push("No clawback provisions");
  if (d.hasClawback !== "" && pN(d.clawbackPct) > 0 && pN(d.clawbackPct) < 50) flags.push("Clawback recovery only " + d.clawbackPct + "% — weak recapture");
  if (d.reportingFrequency === "none") flags.push("No reporting requirement");
  const rfte = pN(d.jobsFTE), reff = getEff(d);
  if (rfte > 0 && reff > 0 && reff / rfte > 30000) flags.push("Cost per job (" + fD(reff / rfte) + ") exceeds $30k threshold");
  const rwage = pN(d.wageAnnual), rmedian = pN(d.areaMedianWage);
  if (rwage > 0 && rmedian > 0 && rwage < rmedian) flags.push("Required wage (" + fD(rwage) + ") is below area median (" + fD(rmedian) + ")");
  if (pN(d.milestoneCount) === 0 && pN(d.completionDeadlineYrs) > 0) flags.push("Completion deadline set but no performance milestones defined");
  if (d.hasFeasibilityStudy === "no") flags.push("No independent feasibility study — GFOA requires verification");
  if (d.hasFinancialDisclosure === "no") flags.push("No developer financial disclosure");
  if (pN(d.submarketVacancy) > 0 && pN(d.submarketVacancy) < 5) flags.push("Very low vacancy (" + d.submarketVacancy + "%) questions incentive necessity");
  if (d.infraFundingSource === "city") flags.push("Infrastructure fully publicly funded");
  if (pN(d.abatementYears) > 10) flags.push("Abatement exceeds 10-yr guideline");
  if (rv > 0 && co > 0 && net < 0) flags.push("Service cost exceeds projected revenue");
  const wCap = pN(d.waterCapacityGPD), wCur = pN(d.waterCurrentGPD), wDem = pN(d.waterDemandGPD);
  if (wCap > 0 && (wCur + wDem) > wCap) flags.push("Project would exceed water system capacity");
  const sCap = pN(d.sewerCapacityGPD), sCur = pN(d.sewerCurrentGPD), sDem = pN(d.sewerDemandGPD);
  if (sCap > 0 && (sCur + sDem) > sCap) flags.push("Project would exceed sewer capacity");
  if (eff > 0 && pN(d.estimatedValue) > 0 && eff / pN(d.estimatedValue) > 0.25) flags.push("Incentive ratio exceeds 25%");
  const totalInfra = pN(d.infraCostEst), devContrib = pN(d.developerInfraContrib);
  if (totalInfra > 0 && devContrib / totalInfra < 0.25) flags.push("Developer covers <25% of infrastructure cost");

  if (d.hasClawback === "yes" && pN(d.clawbackPct) >= 80) strengths.push("Full clawback at " + d.clawbackPct + "% recovery");
  else if (d.hasClawback === "yes") strengths.push("Full clawback provisions");
  if (d.reportingFrequency === "quarterly") strengths.push("Quarterly performance reporting");
  const sfte = pN(d.jobsFTE), seff = getEff(d);
  if (sfte > 0 && seff > 0 && seff / sfte < 15000) strengths.push("Cost per job under $15k (" + fD(seff / sfte) + ")");
  const swage = pN(d.wageAnnual), smedian = pN(d.areaMedianWage);
  if (swage > 0 && smedian > 0 && (swage - smedian) / smedian >= 0.2) strengths.push("Wage premium " + (((swage - smedian) / smedian) * 100).toFixed(0) + "% above area median");
  if (d.infraFundingSource === "developer") strengths.push("Developer-funded infrastructure");
  if (d.hasFeasibilityStudy === "yes") strengths.push("Independent feasibility study on file");
  if (pN(d.submarketVacancy) > 15) strengths.push("High vacancy (" + d.submarketVacancy + "%) supports incentive case");
  if (rv > 0 && co > 0 && net > 0) strengths.push("Positive net fiscal: " + fD(net) + "/yr");
  if (wCap > 0 && (wCur + wDem) / wCap < 0.75) strengths.push("Water utilization stays below 75%");
  if (totalInfra > 0 && devContrib / totalInfra >= 0.8) strengths.push("Developer funds 80%+ of infrastructure");

  const [exporting, setExporting] = useState(false);

  const handleExport = async () => {
    setExporting(true);
    try {
      const { jsPDF } = await loadJsPdf();
      const pdf = new jsPDF({ orientation: "portrait", unit: "pt", format: "letter" });
      const W = 612, H = 792; // US Letter in points
      const ML = 54, MR = 54, MT = 54; // margins
      const CW = W - ML - MR; // content width
      let Y = MT;

      // Colors
      const cIndigo = [51, 66, 92], cPoppy = [217, 56, 51], cJet = [55, 52, 53];
      const cGreen = [45, 122, 79], cYellow = [197, 148, 10], cRed = [192, 57, 43];
      const cGray = [138, 135, 134], cGrayL = [213, 210, 205], cSand = [240, 236, 228];

      const checkPage = (needed) => { if (Y + needed > H - 60) { pdf.addPage(); Y = MT; return true; } return false; };

      // ── HEADER BAR ──
      pdf.setFillColor(...cIndigo);
      pdf.rect(0, 0, W, 80, "F");
      pdf.setTextColor(255, 255, 255);
      pdf.setFontSize(10); pdf.setFont("helvetica", "normal");
      pdf.text("THE CITIZEN — CIVIC TOOLKIT", ML, 30);
      pdf.setFontSize(22); pdf.setFont("helvetica", "bold");
      pdf.text("Development Deal Evaluation Report", ML, 55);
      pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
      pdf.text(new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }), W - MR, 30, { align: "right" });
      Y = 100;

      // ── PROJECT INFO ──
      pdf.setTextColor(...cJet);
      if (d.projectName) { pdf.setFontSize(16); pdf.setFont("helvetica", "bold"); pdf.text(d.projectName, ML, Y); Y += 18; }
      if (d.developer) { pdf.setFontSize(11); pdf.setFont("helvetica", "normal"); pdf.setTextColor(...cGray); pdf.text(d.developer, ML, Y); Y += 14; }
      const infoLine = [d.projectType, d.location, ac > 0 ? d.acreage + " acres" : ""].filter(Boolean).join("  ·  ");
      if (infoLine) { pdf.setFontSize(9); pdf.text(infoLine, ML, Y); Y += 14; }
      if (pN(d.estimatedValue) > 0) { pdf.setFontSize(9); pdf.text("Estimated Project Value: " + fD(pN(d.estimatedValue)), ML, Y); Y += 14; }
      Y += 6;

      // ── OVERALL GRADE BOX ──
      const gradeC = p >= 0.7 ? cGreen : p >= 0.4 ? cYellow : cRed;
      pdf.setFillColor(gradeC[0], gradeC[1], gradeC[2], 0.06);
      pdf.setDrawColor(...gradeC);
      pdf.roundedRect(ML, Y, CW, 60, 4, 4, "FD");
      pdf.setTextColor(...gradeC);
      pdf.setFontSize(28); pdf.setFont("helvetica", "bold");
      pdf.text(grade, W / 2, Y + 28, { align: "center" });
      pdf.setFontSize(12); pdf.setFont("helvetica", "normal");
      pdf.text(t.score + " / " + t.max + " points", W / 2, Y + 46, { align: "center" });
      Y += 76;

      // ── KEY FINANCIALS ROW ──
      if (eff > 0 || (rv > 0 && co > 0)) {
        const metrics = [];
        if (eff > 0) metrics.push({ label: "Total Public Commitment", value: fD(eff), color: cPoppy });
        if (rv > 0 && co > 0) metrics.push({ label: "Net Annual Impact", value: (net >= 0 ? "+" : "") + fD(net) + "/yr", color: net >= 0 ? cGreen : cRed });
        if (ac > 0 && rv > 0 && co > 0) metrics.push({ label: "Net per Acre", value: fD(net / ac), color: net >= 0 ? cGreen : cRed });
        if (net > 0 && eff > 0) metrics.push({ label: "10-Year Net", value: fD(net * 10 - eff), color: (net * 10 - eff) >= 0 ? cGreen : cRed });

        const bw = (CW - (metrics.length - 1) * 8) / metrics.length;
        metrics.forEach((m, i) => {
          const bx = ML + i * (bw + 8);
          pdf.setFillColor(m.color[0], m.color[1], m.color[2], 0.06);
          pdf.roundedRect(bx, Y, bw, 42, 3, 3, "F");
          pdf.setTextColor(...cGray); pdf.setFontSize(7); pdf.setFont("helvetica", "bold");
          pdf.text(m.label.toUpperCase(), bx + 8, Y + 14);
          pdf.setTextColor(...m.color); pdf.setFontSize(14); pdf.setFont("helvetica", "bold");
          pdf.text(m.value, bx + 8, Y + 33);
        });
        Y += 54;
      }

      // ── SECTION SCORES ──
      checkPage(120);
      pdf.setTextColor(...cIndigo); pdf.setFontSize(11); pdf.setFont("helvetica", "bold");
      pdf.text("SECTION SCORES", ML, Y); Y += 16;

      const secs = [
        { label: "Incentive Structure", s: scores.incentive },
        { label: "Fiscal Impact", s: scores.fiscal },
        { label: "Market Evidence", s: scores.market },
        { label: "Infrastructure Capacity", s: scores.infrastructure },
        { label: "Performance & Accountability", s: scores.performance },
      ];
      secs.forEach(sec => {
        const pct = sec.s.max > 0 ? sec.s.score / sec.s.max : 0;
        const sc = pct >= 0.7 ? cGreen : pct >= 0.4 ? cYellow : cRed;
        // Label
        pdf.setTextColor(...cJet); pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
        pdf.text(sec.label, ML, Y + 8);
        // Score
        pdf.setTextColor(...sc); pdf.setFont("helvetica", "bold");
        pdf.text(sec.s.score + "/" + sec.s.max, W - MR, Y + 8, { align: "right" });
        // Bar background
        pdf.setFillColor(...cSand);
        pdf.roundedRect(ML, Y + 12, CW, 6, 2, 2, "F");
        // Bar fill
        pdf.setFillColor(...sc);
        if (pct > 0) pdf.roundedRect(ML, Y + 12, Math.max(CW * pct, 4), 6, 2, 2, "F");
        Y += 24;
      });
      Y += 8;

      // ── PERFORMANCE METRICS ──
      const xfte = pN(d.jobsFTE), xeff = getEff(d);
      if (xfte > 0 || pN(d.capitalInvestMin) > 0) {
        checkPage(90);
        pdf.setTextColor(...cIndigo); pdf.setFontSize(11); pdf.setFont("helvetica", "bold");
        pdf.text("PERFORMANCE METRICS", ML, Y); Y += 16;
        pdf.setTextColor(...cJet); pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
        if (xfte > 0) { pdf.text("FTEs Committed: " + d.jobsFTE, ML, Y); Y += 13; }
        if (xfte > 0 && xeff > 0) { pdf.text("Cost per Job: " + fD(xeff / xfte), ML, Y); Y += 13; }
        const xw = pN(d.wageAnnual), xm = pN(d.areaMedianWage);
        if (xw > 0 && xm > 0) { pdf.text("Wage Premium: " + (((xw - xm) / xm) * 100).toFixed(0) + "% vs area median", ML, Y); Y += 13; }
        if (xw > 0 && xfte > 0) { pdf.text("Annual Payroll Impact: " + fD(xw * xfte), ML, Y); Y += 13; }
        if (pN(d.capitalInvestMin) > 0 && xfte > 0) { pdf.text("Capital per Job: " + fD(pN(d.capitalInvestMin) / xfte), ML, Y); Y += 13; }
        if (pN(d.clawbackPct) > 0 && xeff > 0) { pdf.text("Max Recoverable: " + fD(xeff * pN(d.clawbackPct) / 100) + " (" + d.clawbackPct + "% clawback)", ML, Y); Y += 13; }
        Y += 6;
      }

      // ── PRODUCTIVITY PER ACRE ──
      if (ac > 0) {
        checkPage(100);
        pdf.setTextColor(...cIndigo); pdf.setFontSize(11); pdf.setFont("helvetica", "bold");
        pdf.text("FISCAL PRODUCTIVITY PER ACRE", ML, Y); Y += 16;
        pdf.setTextColor(...cJet); pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
        const projVPA = pN(d.estimatedValue) / ac;
        const jAcr = pN(d.jurisdictionAcreage), taxB = pN(d.existingTaxBase);
        const jAvg = jAcr > 0 && taxB > 0 ? taxB / jAcr : 0;
        if (pN(d.estimatedValue) > 0) { pdf.text("Assessed Value/Acre:  " + fD(projVPA) + (jAvg > 0 ? "  (city avg: " + fD(jAvg) + ")" : ""), ML, Y); Y += 13; }
        if (rv > 0) { pdf.text("Revenue/Acre:  " + fD(rv / ac), ML, Y); Y += 13; }
        if (co > 0) { pdf.text("Cost/Acre:  " + fD(co / ac), ML, Y); Y += 13; }
        if (rv > 0 && co > 0) { pdf.text("Net Productivity/Acre:  " + fD(net / ac), ML, Y); Y += 13; }
        if (eff > 0) { pdf.text("Incentive/Acre:  " + fD(eff / ac), ML, Y); Y += 13; }
        if (pN(d.infraCostEst) > 0) { pdf.text("Infrastructure/Acre:  " + fD(pN(d.infraCostEst) / ac), ML, Y); Y += 13; }
        if (pN(d.infraCostEst) > 0) { pdf.text("30-Yr Lifecycle/Acre:  " + fD(pN(d.infraCostEst) * 3.5 / ac), ML, Y); Y += 13; }
        if (xfte > 0) { pdf.text("Jobs/Acre:  " + (xfte / ac).toFixed(1), ML, Y); Y += 13; }
        if (jAvg > 0 && projVPA > 0) {
          Y += 4;
          pdf.setFont("helvetica", "bold");
          pdf.setTextColor(...(projVPA >= jAvg ? cGreen : cRed));
          pdf.text("Productivity Ratio: " + (projVPA / jAvg).toFixed(2) + "x city average", ML, Y);
          Y += 13;
        }
        Y += 6;
      }

      // ── INFRASTRUCTURE CAPACITY ──
      const wCapV = pN(d.waterCapacityGPD), sCapV = pN(d.sewerCapacityGPD);
      if (wCapV > 0 || sCapV > 0) {
        checkPage(70);
        pdf.setTextColor(...cIndigo); pdf.setFontSize(11); pdf.setFont("helvetica", "bold");
        pdf.text("INFRASTRUCTURE CAPACITY", ML, Y); Y += 16;
        pdf.setTextColor(...cJet); pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
        if (wCapV > 0) {
          const wPost = ((pN(d.waterCurrentGPD) + pN(d.waterDemandGPD)) / wCapV * 100).toFixed(0);
          pdf.text("Water: " + wPost + "% utilization post-project (capacity: " + (wCapV / 1000).toFixed(0) + "k GPD)", ML, Y); Y += 13;
        }
        if (sCapV > 0) {
          const sPost = ((pN(d.sewerCurrentGPD) + pN(d.sewerDemandGPD)) / sCapV * 100).toFixed(0);
          pdf.text("Sewer: " + sPost + "% utilization post-project (capacity: " + (sCapV / 1000).toFixed(0) + "k GPD)", ML, Y); Y += 13;
        }
        if (pN(d.powerAvailableMW) > 0 && pN(d.powerDemandMW) > 0) {
          pdf.text("Power: " + d.powerDemandMW + " MW demand / " + d.powerAvailableMW + " MW available (" + ((pN(d.powerDemandMW) / pN(d.powerAvailableMW)) * 100).toFixed(0) + "% of capacity)", ML, Y); Y += 13;

      // ── RED FLAGS ──

        checkPage(30 + flags.length * 14);
        pdf.setFillColor(cRed[0], cRed[1], cRed[2], 0.04);

        pdf.setDrawColor(...cRed); pdf.setLineWidth(0.5);
        pdf.roundedRect(ML, Y, CW, flagH, 3, 3, "S");

        pdf.setTextColor(...cRed); pdf.setFontSize(8); pdf.setFont("helvetica", "bold");
        pdf.text("RED FLAGS (" + flags.length + ")", ML + 10, Y + 8); Y += 16;

        checkPage(30 + strengths.length * 14);
        pdf.setFillColor(cGreen[0], cGreen[1], cGreen[2], 0.04);
        const strH = 22 + strengths.length * 14;
        pdf.roundedRect(ML, Y, CW, strH, 3, 3, "F");
        pdf.setDrawColor(...cGreen); pdf.setLineWidth(0.5);
        pdf.roundedRect(ML, Y, CW, strH, 3, 3, "S");
        Y += 6;
        pdf.setTextColor(...cGreen); pdf.setFontSize(8); pdf.setFont("helvetica", "bold");
        pdf.text("STRENGTHS (" + strengths.length + ")", ML + 10, Y + 8); Y += 16;
        pdf.setFontSize(9); pdf.setFont("helvetica", "normal");
        strengths.forEach(s => {

          lines.forEach(line => { pdf.text("✓  " + line, ML + 10, Y); Y += 12; });

      // ── AI DISCLAIMER ──
      if (aiCount > 0) {
        checkPage(30);
        pdf.setFontSize(8); pdf.setTextColor(180, 120, 10); pdf.setFont("helvetica", "italic");

      pdf.setFont("helvetica", "normal");
      const methText = "Fiscal productivity: Urban3 value-per-acre methodology. Infrastructure: GFOA lifecycle cost and capital planning best practices. Market evidence: GFOA but-for analysis with empirical inputs. Performance: GFOA agreement negotiation and monitoring standards. References: GFOA, ICMA, APA, NLC, Lincoln Institute, TML, NCTCOG. Texas: Ch. 312, Ch. 380/381, TCEQ.";
      const methLines = pdf.splitTextToSize(methText, CW - 20);
      methLines.forEach((line, i) => { pdf.text(line, ML + 10, Y + 26 + i * 10); });
      Y += 64 + 10;

      // ── PAGE FOOTER ──
      const pageCount = pdf.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        pdf.setPage(i);
        pdf.setFillColor(...cIndigo);
        pdf.rect(0, H - 28, W, 28, "F");
        pdf.setTextColor(255, 255, 255); pdf.setFontSize(7); pdf.setFont("helvetica", "normal");
        pdf.text("The Citizen  ·  thecitizentx.com  ·  GFOA Best Practices  ·  Urban3 Value/Acre Methodology  ·  Not legal or financial advice.", W / 2, H - 12, { align: "center" });
        pdf.text("Page " + i + " of " + pageCount, W - MR, H - 12, { align: "right" });
      }

      const blob = pdf.output("blob");
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    } catch (err) {
      console.error("PDF export error:", err);
      alert("PDF export failed: " + err.message);
    } finally {
      setExporting(false);
    }
  };

  return <div>
    <SH icon="📄" title="Full Evaluation Report" />
    <div style={{ textAlign: "center", padding: "24px 20px", background: gc + "0C", border: `2px solid ${gc}30`, borderRadius: 8, marginBottom: 24 }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: B.gray, letterSpacing: "0.08em", textTransform: "uppercase" }}>Overall</div>
      <div style={{ fontSize: 42, fontWeight: 900, color: gc }}>{grade}</div>
      <div style={{ fontSize: 18, fontWeight: 600, color: B.jet }}>{t.score} / {t.max}</div>
      {d.projectName && <div style={{ fontSize: 13, color: B.gray, marginTop: 4 }}>{d.projectName}{d.developer ? " — " + d.developer : ""}{ac > 0 ? ` · ${d.acreage} acres` : ""}</div>}
    </div>
    {(eff > 0 || rv > 0) && <div style={{ display: "flex", gap: 16, marginBottom: 20, flexWrap: "wrap" }}>
      {eff > 0 && <CB label="Public $" value={fD(eff)} color={B.poppy} />}
      {rv > 0 && co > 0 && <CB label="Net/yr" value={(net >= 0 ? "+" : "") + fD(net)} color={net >= 0 ? B.green : B.red} />}
      {ac > 0 && rv > 0 && co > 0 && <CB label="Net/Acre" value={fD(net / ac)} color={net >= 0 ? B.green : B.red} />}
      {net > 0 && eff > 0 && <CB label="10-Yr Net" value={fD(net * 10 - eff)} color={(net * 10 - eff) >= 0 ? B.green : B.red} />}
    </div>}
    <div style={{ marginBottom: 24 }}>
      <SBar label="Incentive Structure" score={scores.incentive.score} max={scores.incentive.max} />
      <SBar label="Fiscal Impact" score={scores.fiscal.score} max={scores.fiscal.max} />
      <SBar label="Market Evidence" score={scores.market.score} max={scores.market.max} />
      <SBar label="Infrastructure Capacity" score={scores.infrastructure.score} max={scores.infrastructure.max} />
      <SBar label="Performance & Accountability" score={scores.performance.score} max={scores.performance.max} />
    </div>
    {flags.length > 0 && <div style={{ background: B.red + "08", border: `1px solid ${B.red}25`, borderRadius: 6, padding: "14px 18px", marginBottom: 16 }}><div style={{ fontSize: 12, fontWeight: 700, color: B.red, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8 }}>Red Flags ({flags.length})</div>{flags.map((f, i) => <div key={i} style={{ fontSize: 13, color: B.jet, padding: "4px 0", display: "flex", gap: 8 }}><span style={{ color: B.red }}>⚠</span>{f}</div>)}</div>}
    {strengths.length > 0 && <div style={{ background: B.green + "08", border: `1px solid ${B.green}25`, borderRadius: 6, padding: "14px 18px", marginBottom: 16 }}><div style={{ fontSize: 12, fontWeight: 700, color: B.green, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8 }}>Strengths ({strengths.length})</div>{strengths.map((s, i) => <div key={i} style={{ fontSize: 13, color: B.jet, padding: "4px 0", display: "flex", gap: 8 }}><span style={{ color: B.green }}>✓</span>{s}</div>)}</div>}
    <div style={{ display: "flex", gap: 12, marginTop: 20 }}>
      <button onClick={handleExport} disabled={exporting} style={{ padding: "10px 24px", background: B.indigo, color: "#fff", border: "none", borderRadius: 4, fontWeight: 700, cursor: exporting ? "wait" : "pointer", fontFamily: "inherit", opacity: exporting ? 0.7 : 1 }}>{exporting ? "⏳ Generating PDF..." : "Export Report (PDF)"}</button>
      <button onClick={onReset} style={{ padding: "10px 24px", background: "#fff", border: "1px solid " + B.grayL, borderRadius: 4, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>New Evaluation</button>
    </div>
    <div style={{ marginTop: 28, padding: "16px 18px", background: B.sand, borderRadius: 6, fontSize: 12, color: B.gray, lineHeight: 1.5 }}>
      <strong style={{ color: B.indigo }}>Methodology</strong>
      <p style={{ margin: "6px 0 0" }}>Fiscal productivity: Urban3 value-per-acre methodology. Infrastructure: GFOA lifecycle cost and capital planning best practices. Market evidence: GFOA but-for analysis framework with empirical inputs replacing subjective assessment. Performance: GFOA agreement negotiation and monitoring standards.</p>
      <p style={{ margin: "6px 0 0" }}>References: GFOA, ICMA, APA, NLC, Lincoln Institute, TML, NCTCOG. Texas: Ch. 312, Ch. 380/381, TCEQ utility data.</p>
      <p style={{ margin: "6px 0 0", fontStyle: "italic" }}>Public resource of The Citizen (thecitizentx.com). Not legal or financial advice.</p>
    </div>
  </div>;
}

/* ═══ MAIN ═══ */
function App() {
  const [data, setData] = useState({ ...D }); const [sec, setSec] = useState("overview");
  const nav = useCallback((id) => { setSec(id); window.scrollTo(0, 0); }, []);
  const [showImport, setShowImport] = useState(false); const [aiFields, setAiFields] = useState(new Set());
  const s = useCallback((k, v) => { setData(p => ({ ...p, [k]: v })); setAiFields(p => { const n = new Set(p); n.delete(k); return n; }); }, []);
  const reset = useCallback(() => { if (confirm("Clear all entries and start a new evaluation?")) { setData({ ...D }); nav("overview"); setAiFields(new Set()); setShowImport(false); } }, [nav]);
  const applyAI = useCallback((fields) => {
    const nAi = new Set();
    setData(p => { const n = { ...p }; Object.entries(fields).forEach(([k, v]) => { if (!(k in D)) return; if (k === "incentiveTypes" && Array.isArray(v) && v.length > 0) { n[k] = v; nAi.add(k); } else if (v && String(v).trim() !== "" && String(v) !== "0" && (!p[k] || String(p[k]).trim() === "")) { n[k] = String(v); nAi.add(k); } }); return n; });
    setAiFields(p => new Set([...p, ...nAi])); setShowImport(false);
  }, []);
  const scores = useMemo(() => computeScores(data), [data]);
  const ci = SECS.findIndex(x => x.id === sec);
  const sMap = {
    overview: <OverviewSec d={data} s={s} ai={aiFields} />,
    incentives: <IncentiveSec d={data} s={s} scores={scores} ai={aiFields} />,
    market: <MarketSec d={data} s={s} scores={scores} ai={aiFields} />,
    infracap: <InfraCapSec d={data} s={s} scores={scores} ai={aiFields} />,
    performance: <PerfSec d={data} s={s} scores={scores} ai={aiFields} />,
    productivity: <ProductivitySec d={data} scores={scores} />,
    report: <ReportSec d={data} scores={scores} onReset={reset} aiCount={aiFields.size} />,
  };
  const completion = useMemo(() => {
    let f = 0, t = 0; const ck = v => { t++; if (v && (Array.isArray(v) ? v.length > 0 : String(v).trim() !== "")) f++; };
    ck(data.projectName); ck(data.acreage); ck(data.estimatedValue); ck(data.cityTaxRate);
    ck(data.incentiveTypes); ck(data.abatementPct);
    ck(data.projectedRevAnnual); ck(data.projectedCostAnnual);
    ck(data.submarketVacancy); ck(data.hasFeasibilityStudy);
    ck(data.waterCapacityGPD); ck(data.waterCurrentGPD); ck(data.waterDemandGPD);
    ck(data.infraCostEst); ck(data.developerInfraContrib);
    ck(data.hasClawback); ck(data.clawbackPct); ck(data.reportingFrequency);
    ck(data.jobsFTE); ck(data.wageAnnual); ck(data.areaMedianWage); ck(data.capitalInvestMin);
    ck(data.milestoneCount); ck(data.completionDeadlineYrs);
    return t > 0 ? Math.round((f / t) * 100) : 0;
  }, [data]);

  return (
    <div style={{ fontFamily: "'DM Sans', system-ui, sans-serif", background: B.offWhite, minHeight: "100vh", position: "relative" }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet" />
      <img src={TOOLKIT_LOGO} alt="The Citizen Toolkit" style={{ position: "absolute", top: 12, right: 16, height: 52, zIndex: 10 }} />
      <div style={{ background: B.indigo, color: "#fff", padding: "20px 24px" }}>
        <div style={{ maxWidth: 920, margin: "0 auto" }}>
          <h1 style={{ margin: 0, fontFamily: "'DM Serif Display', serif", fontSize: 26, fontWeight: 400, color: "#fff", paddingRight: 200 }}>Development Deal Evaluator</h1>
          <p style={{ margin: "6px 0 0", fontSize: 13, opacity: 0.7 }}>Empirical analysis against GFOA best practices · Urban3 productivity methodology</p>
          <div style={{ display: "flex", alignItems: "center", gap: 16, marginTop: 12 }}>
            <button onClick={() => setShowImport(!showImport)} style={{ padding: "8px 16px", background: showImport ? B.poppy : "rgba(255,255,255,0.15)", color: "#fff", border: "1px solid rgba(255,255,255,0.25)", borderRadius: 4, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>📄 AI Import</button>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", opacity: 0.5 }}>Done</div><div style={{ fontSize: 20, fontWeight: 800 }}>{completion}%</div><div style={{ height: 3, background: "rgba(255,255,255,0.15)", borderRadius: 2, width: 60 }}><div style={{ height: "100%", width: completion + "%", background: completion >= 75 ? B.green : B.yellow, borderRadius: 2, transition: "width 0.3s" }} /></div></div>
          </div>
        </div>
      </div>
      <div style={{ background: "#fff", borderBottom: "1px solid " + B.grayL, overflowX: "auto" }}>
        <div style={{ maxWidth: 920, margin: "0 auto", display: "flex" }}>
          {SECS.map(x => <button key={x.id} onClick={() => nav(x.id)} style={{ padding: "10px 14px", fontSize: 12, fontWeight: sec === x.id ? 700 : 500, color: sec === x.id ? B.indigo : B.gray, background: "transparent", border: "none", cursor: "pointer", borderBottom: sec === x.id ? "2px solid " + B.poppy : "2px solid transparent", whiteSpace: "nowrap", fontFamily: "inherit" }}><span style={{ marginRight: 4 }}>{x.icon}</span>{x.label}</button>)}
        </div>
      </div>
      <div style={{ maxWidth: 920, margin: "0 auto", padding: "24px 24px 60px" }}>
        {showImport && <ImportPanel onApply={applyAI} onClose={() => setShowImport(false)} />}
        {aiFields.size > 0 && !showImport && <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", background: B.amber + "10", border: `1px solid ${B.amber}25`, borderRadius: 6, marginBottom: 16, fontSize: 12, color: B.amber }}><span style={{ fontWeight: 700 }}>●</span> {aiFields.size} AI DRAFT fields — verify against source documents. <button onClick={() => setShowImport(true)} style={{ marginLeft: "auto", background: "none", border: "none", color: B.indigo, fontSize: 12, fontWeight: 600, cursor: "pointer", textDecoration: "underline", fontFamily: "inherit" }}>Import another</button></div>}
        {sMap[sec]}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 32, paddingTop: 20, borderTop: "1px solid " + B.grayL }}>
          {ci > 0 ? <button onClick={() => nav(SECS[ci - 1].id)} style={{ padding: "10px 20px", background: "#fff", color: B.indigo, border: "1px solid " + B.indigo + "40", borderRadius: 4, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{"← " + SECS[ci - 1].label}</button> : <div />}
          {ci < SECS.length - 1 ? <button onClick={() => nav(SECS[ci + 1].id)} style={{ padding: "10px 20px", background: B.indigo, color: "#fff", border: "none", borderRadius: 4, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>{SECS[ci + 1].label + " →"}</button> : <div />}
        </div>
      </div>
      {/* References & Research Sources */}
      <div style={{ maxWidth: 920, margin: "0 auto", padding: "0 24px 24px" }}>
        <div style={{ background: B.sand, borderRadius: 8, padding: "20px 24px" }}>
          <h3 style={{ margin: "0 0 12px", fontSize: 14, fontWeight: 800, color: B.indigo, letterSpacing: "0.04em", textTransform: "uppercase" }}>References & Research Sources</h3>
          <p style={{ margin: "0 0 12px", fontSize: 12, color: B.gray, lineHeight: 1.4 }}>
            Methodology, market research, and framework sources. These are not data lookup tools — they provide the analytical frameworks and industry reports that inform this evaluator's criteria.
          </p>
          {["Methodology", "Market Research", "Research"].map(cat => {
            const items = REFERENCES.filter(r => r.category === cat);
            if (items.length === 0) return null;
            return <div key={cat} style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: B.indigo, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 4 }}>{cat}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {items.map((r, i) => <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, color: B.jet, textDecoration: "none", padding: "4px 10px", borderRadius: 4, background: "#fff", border: `1px solid ${B.grayL}`, lineHeight: 1.3 }}>
                  <span style={{ fontSize: 10, color: B.gray }}>↗</span> {r.label}
                </a>)}
              </div>
            </div>;
          })}
        </div>
      </div>
      <div style={{ background: B.jet, color: "#fff", padding: "16px 24px", textAlign: "center", fontSize: 11, opacity: 0.7 }}>The Citizen · thecitizentx.com · GFOA Best Practices · Urban3 Value/Acre Methodology</div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

</script>
</body>
</html>
